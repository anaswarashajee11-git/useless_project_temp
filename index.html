<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Graveyard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="moon"></div>
  <div class="entrance">CNTRL+Z</div>
  <div class="stars"></div>

  <div class="graveyard">
    <div class="tombstone">
      <div class="info">Cause: Syntax Error<br>Date: 12/03/2024</div>
    </div>
    <div class="tombstone">
      <div class="info">Cause: Infinite Loop<br>Date: 05/07/2025</div>
    </div>
    <div class="tombstone">
      <div class="info">Cause: Null Reference<br>Date: 21/09/2023</div>
    </div>
    <div class="tombstone">
      <div class="info">Cause: Burnout<br>Date: 14/02/2026</div>
    </div>
    <div class="tombstone">
      <div class="info">Cause: Memory Leak<br>Date: 30/11/2022</div>
    </div>
    <div class="tombstone">
      <div class="info">Cause: Deadline Missed<br>Date: 01/01/2025</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
