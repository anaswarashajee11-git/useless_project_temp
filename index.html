<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CTRL + Z Cemetery</title>

    <link rel="stylesheet" href="./style.css">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <!-- 3D WORLD -->
    <div id="scene"></div>


   

    <div class="brand">

        <div class="brand-symbol">⚜</div>

        <div>
            <div class="brand-main">CTRL + Z</div>
            <div class="brand-title">DIGITAL CEMETERY</div>
            <div class="brand-subtitle">
                Where forgotten files come to rest.
            </div>
        </div>

    </div>


    <!-- ================================= -->
    <!-- TOP RIGHT -->
    <!-- ================================= -->

    <div class="top-right">

        <label for="fileInput" class="bury-button">
            ⚰ BURY A NEW FILE
        </label>

        <input
            type="file"
            id="fileInput"
            multiple
        >

        <div class="counter">
            🪦 Buried files:
            <span id="graveCount">0</span>
        </div>

    </div>


    <!-- ================================= -->
    <!-- CENTER WELCOME -->
    <!-- ================================= -->

    <div id="welcome">

        <div class="welcome-small">
            CTRL + Z
        </div>

        <div class="welcome-title">
            CEMETERY
        </div>

        <div class="welcome-line"></div>

        <div class="welcome-subtitle">
            A resting place for forgotten digital memories
        </div>

        <div class="approach">
            Approach the gates...
        </div>

    </div>


    <!-- ================================= -->
    <!-- MEMORIAL PANEL -->
    <!-- ================================= -->

    <div id="memorialPanel">

        <button id="closeMemorial">
            ×
        </button>

        <div id="memorialContent"></div>

        <button id="openVisitorPanel" class="visitor-open">
            🌹 Leave a Rose / Comment
        </button>

    </div>


    <!-- ================================= -->
    <!-- VISITOR PANEL -->
    <!-- ================================= -->

    <div id="visitorPanel">

        <button id="closeVisitorPanel">
            ×
        </button>

        <h2>🌹 Visitor Memorial</h2>

        <h3 id="selectedTombName">
            Tomb
        </h3>

        <div class="rose-area">

            <div>
                🌹 Roses:
                <span id="roseCount">0</span>
            </div>

            <button id="roseButton">
                Leave a Rose
            </button>

        </div>


        <div class="comment-area">

            <textarea
                id="commentInput"
                placeholder="Leave a message..."
            ></textarea>

            <button id="commentButton">
                Leave Comment
            </button>

        </div>


        <div id="comments"></div>

    </div>


    <!-- ================================= -->
    <!-- VISITOR BUTTON -->
    <!-- ================================= -->

    <button id="visitorButton">
        👻 VISITORS
    </button>


    <!-- ================================= -->
    <!-- BOTTOM INSTRUCTIONS -->
    <!-- ================================= -->

    <div class="instructions">

        <span>
            🖱 Drag to look
        </span>

        <span>
            ⌨ Scroll to move
        </span>

        <span>
            🪦 Tap a tomb
        </span>

        <span>
            🌹 Leave a rose
        </span>

    </div>


    <script src="./script.js"></script>

</body>
</html>
